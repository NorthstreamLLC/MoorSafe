<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;background:#0B1F33;font-family:'Manrope',system-ui,sans-serif;color:#fff;overflow:hidden}
.wrap{position:relative;width:1200px;height:630px;display:flex;align-items:center;padding:0 72px;box-sizing:border-box;gap:56px;
  background:radial-gradient(900px 500px at 85% 40%,rgba(26,143,168,.35),transparent 60%),#0B1F33}
.left{flex:1;display:grid;gap:26px}
.tag{display:flex;gap:12px;align-items:center;font-size:20px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#F26B0F}
.tag i{width:10px;height:10px;border-radius:50%;background:#F26B0F;display:block}
h1{margin:0;font-size:72px;line-height:1.02;letter-spacing:-.035em;font-weight:800}
p{margin:0;font-size:27px;line-height:1.35;color:rgba(255,255,255,.78);font-weight:500;max-width:560px}
.logo{position:absolute;left:72px;top:48px;background:#fff;border-radius:999px;padding:10px 22px}.logo img{height:30px;display:block}
.card{flex:none;width:400px;height:480px;background:#fff;border-radius:32px;display:grid;place-items:center;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.card img{max-width:340px;max-height:420px;object-fit:contain}
.left{padding-top:96px}
</style></head>
<body><div class="wrap">
  <div class="logo"><img src="../assets/logo-transparent.png" alt=""></div>
  <div class="left">
    <div class="tag"><i></i>Made in Maine · Patent pending</div>
    <h1>The mooring anchor that won't chain wrap.</h1>
    <p>Three bars turn the stem into a cone. Tested at Yale Cordage and in Casco Bay.</p>
  </div>
  <div class="card"><img src="../uploads/anchor-hero.jpg" alt=""></div>
</div></body></html>
